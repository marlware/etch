name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  AWS_REGION: us-east-1

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build and test
        # Docker is preinstalled on ubuntu-latest runners, so the
        # Testcontainers-backed tests (order-service, notification-service)
        # run against real MySQL/Kafka containers here. verify covers
        # compile, unit tests (surefire) and integration tests (failsafe).
        run: mvn -B verify

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/target/surefire-reports/**
            **/target/failsafe-reports/**
          retention-days: 7

  build-and-push-images:
    name: Build and push Docker images
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      matrix:
        service: [order-service, notification-service, email-service, sms-service, api-gateway]
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            -f services/${{ matrix.service }}/Dockerfile \
            -t "$ECR_REGISTRY/etch-${{ matrix.service }}:$IMAGE_TAG" \
            -t "$ECR_REGISTRY/etch-${{ matrix.service }}:latest" \
            .
          docker push "$ECR_REGISTRY/etch-${{ matrix.service }}:$IMAGE_TAG"
          docker push "$ECR_REGISTRY/etch-${{ matrix.service }}:latest"

  deploy:
    name: Deploy to ECS
    needs: build-and-push-images
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      matrix:
        service: [order-service, notification-service, email-service, sms-service, api-gateway]
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Render task definition template
        id: render
        env:
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
        run: |
          envsubst < "infrastructure/aws/ecs/${{ matrix.service }}-task-def.json" > rendered-task-def.json
          echo "path=rendered-task-def.json" >> "$GITHUB_OUTPUT"

      - name: Set the new image on the task definition
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ${{ steps.render.outputs.path }}
          container-name: ${{ matrix.service }}
          image: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/etch-${{ matrix.service }}:${{ github.sha }}

      - name: Deploy task definition to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: ${{ matrix.service }}
          cluster: etch-cluster
          wait-for-service-stability: true

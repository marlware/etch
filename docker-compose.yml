name: etch

services:

  kafka:
    image: apache/kafka:3.8.0
    container_name: etch-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:19092,CONTROLLER://:9093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,PLAINTEXT_HOST://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    healthcheck:
      test: [ "CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:19092" ]
      interval: 10s
      timeout: 10s
      retries: 10
    networks: [ etch-net ]

  mysql:
    image: mysql:8.4
    container_name: etch-mysql
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - mysql-data:/var/lib/mysql
      - ./infrastructure/docker/mysql-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot" ]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [ etch-net ]

  redis:
    image: redis:7-alpine
    container_name: etch-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [ etch-net ]

  email-service:
    build:
      context: .
      dockerfile: services/email-service/Dockerfile
    container_name: etch-email-service
    ports:
      - "8083:8083"
    environment:
      EMAIL_UNAVAILABLE_RATE: "0.0"
      EMAIL_FAILURE_RATE: "0.1"
    networks: [ etch-net ]

  sms-service:
    build:
      context: .
      dockerfile: services/sms-service/Dockerfile
    container_name: etch-sms-service
    ports:
      - "8084:8084"
    environment:
      SMS_UNAVAILABLE_RATE: "0.0"
      SMS_FAILURE_RATE: "0.1"
    networks: [ etch-net ]

  order-service:
    build:
      context: .
      dockerfile: services/order-service/Dockerfile
    container_name: etch-order-service
    ports:
      - "8081:8081"
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: etch_orders
      DB_USERNAME: etch
      DB_PASSWORD: etch
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks: [ etch-net ]

  notification-service:
    build:
      context: .
      dockerfile: services/notification-service/Dockerfile
    container_name: etch-notification-service
    ports:
      - "8082:8082"
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: etch_notifications
      DB_USERNAME: etch
      DB_PASSWORD: etch
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      REDIS_HOST: redis
      REDIS_PORT: 6379
      EMAIL_SERVICE_URL: http://email-service:8083
      SMS_SERVICE_URL: http://sms-service:8084
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
      email-service:
        condition: service_started
      sms-service:
        condition: service_started
    networks: [ etch-net ]

  api-gateway:
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
    container_name: etch-api-gateway
    ports:
      - "8080:8080"
    environment:
      ORDER_SERVICE_URL: http://order-service:8081
      NOTIFICATION_SERVICE_URL: http://notification-service:8082
    depends_on:
      order-service:
        condition: service_started
      notification-service:
        condition: service_started
    networks: [ etch-net ]

networks:
  etch-net:
    driver: bridge

volumes:
  mysql-data:

spring:
  application:
    name: email-service

server:
  port: 8083

etch:
  simulation:
    unavailable-rate: ${EMAIL_UNAVAILABLE_RATE:0.0}
    failure-rate: ${EMAIL_FAILURE_RATE:0.05}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  health:
    readinessstate:
      enabled: true
    livenessstate:
      enabled: true

logging:
  pattern:
    level: "%5p [correlationId=%X{correlationId}]"

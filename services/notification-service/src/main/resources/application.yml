spring:
  application:
    name: notification-service

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:etch_notifications}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:etch}
    password: ${DB_PASSWORD:etch}
    hikari:
      maximum-pool-size: 10

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms

server:
  port: 8082
  shutdown: graceful

etch:
  channel-clients:
    email-service-url: ${EMAIL_SERVICE_URL:http://localhost:8083}
    sms-service-url: ${SMS_SERVICE_URL:http://localhost:8084}
    connect-timeout-ms: 2000
    read-timeout-ms: 3000
  retry:
    max-attempts: 3
    base-delay-ms: 500

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  health:
    readinessstate:
      enabled: true
    livenessstate:
      enabled: true

logging:
  pattern:
    level: "%5p [correlationId=%X{correlationId}]"
